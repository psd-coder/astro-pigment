name: Publish to npm

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# Jobs opt into exactly what they need
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never interrupt a release mid-publish

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI_RUN: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup runner
        uses: ./.github/actions/prepare-runner
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test

  # The critical job: no dependencies installed, no cache, no third-party actions.
  # Anything running here can publish the package.
  publish:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      id-token: write # OIDC token npm exchanges for trusted publishing
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false # Slower, but no cache poisoning risk
          registry-url: "https://registry.npmjs.org"
      - name: Enable pnpm
        # `corepack install` verifies the download against the SHA512 in package.json's packageManager field
        run: |
          corepack enable
          corepack install
      - name: Stage npm package for release
        run: pnpm stage publish --ignore-scripts --no-git-checks
